services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_health
    ports:
      - '${APP_HEALTH_POSTGRES_PORT:-15432}:5432'
    volumes:
      - app-health-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_health']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./service
    entrypoint: ['/app/app-health-migrate']
    command: ['status']
    environment:
      APP_HEALTH_DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/app_health?sslmode=disable'
      APP_HEALTH_ENV: 'development'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  retention:
    build:
      context: ./service
    entrypoint: ['/app/app-health-retention']
    command: ['dry-run']
    environment:
      APP_HEALTH_DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/app_health?sslmode=disable'
      APP_HEALTH_ENV: 'development'
      APP_HEALTH_EVENT_RETENTION_DAYS: '30'
      APP_HEALTH_RETENTION_DRY_RUN: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  service:
    build:
      context: ./service
    environment:
      APP_HEALTH_ADDR: ':8080'
      APP_HEALTH_DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/app_health?sslmode=disable'
      APP_HEALTH_INGEST_TOKEN: 'ingest_dev'
      APP_HEALTH_ADMIN_TOKEN: 'admin_dev'
      APP_HEALTH_CORS_ORIGINS: 'http://localhost:5173,http://localhost:5174,http://localhost:5181'
      APP_HEALTH_ENV: 'development'
      APP_HEALTH_MAX_BODY_BYTES: '1048576'
      APP_HEALTH_INGEST_RATE_LIMIT_RPS: '20'
      APP_HEALTH_INGEST_RATE_LIMIT_BURST: '100'
      APP_HEALTH_ALERT_WEBHOOK_URL: ''
      APP_HEALTH_ALERT_MIN_LEVEL: 'fatal'
      APP_HEALTH_ALERT_COOLDOWN_SECONDS: '300'
      APP_HEALTH_ALERT_TIMEOUT_SECONDS: '5'
      APP_HEALTH_ADMIN_EMAIL: 'admin@example.com'
      APP_HEALTH_ADMIN_PASSWORD_HASH: '$$2a$$10$$B76xdQ9IRhG8L4LmoGNZFeFR2CsCCXPdXOsh5jqfTSGWc9byFjTjW'
      APP_HEALTH_SESSION_SECRET: 'development_session_secret_32_chars_minimum'
      APP_HEALTH_COOKIE_SECURE: 'false'
      APP_HEALTH_SESSION_TTL_HOURS: '168'
    ports:
      - '${APP_HEALTH_SERVICE_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: ./admin
      args:
        VITE_APP_HEALTH_API_BASE_URL: '${APP_HEALTH_PUBLIC_API_BASE_URL:-http://localhost:8080}'
        VITE_APP_HEALTH_ADMIN_TOKEN: ''
    ports:
      - '${APP_HEALTH_ADMIN_PORT:-5173}:80'
    depends_on:
      service:
        condition: service_healthy

volumes:
  app-health-postgres-data:
