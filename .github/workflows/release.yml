name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          npm install --global pnpm@10.32.1
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: pnpm verify:release

      # `changeset publish` publishes every non-private package whose local version is missing
      # from the registry, and it ignores `.changeset/config.json`'s `ignore` list. The scope
      # gate requires every unpublished package to be either declared in release/plan.json
      # (published now) or an explicit entry in release/holds.json (deliberately deferred), so
      # a pending package cannot be swept into this release by accident. The plan file also
      # lets one tag ship several differently-versioned packages in a single run.
      - name: Check publish scope
        run: pnpm check:publish-scope --plan release/plan.json --require-tag "$GITHUB_REF_NAME"

      - name: Publish to npm
        run: pnpm check:publish-scope --plan release/plan.json --require-tag "$GITHUB_REF_NAME" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Created after publishing on purpose: a failed publish must not leave behind a GitHub
      # Release that looks like the version shipped.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
